name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUILD_FROM_PROJECT_ROOT: "1"

jobs:
  # scheduler_rs unit tests (debug profile, --features cpsat).
  rust:
    name: Rust tests (scheduler_rs)
    runs-on: ubuntu-24.04  # must match the OR-Tools archive (setup-ortools)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Prebuilt C++ archive (bundles protobuf and abseil); cached between runs.
      - name: Install OR-Tools
        uses: ./.github/actions/setup-ortools

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Explicit path: the default '**/uv.lock' glob walks the tree and dies with ELOOP on
          # the self-referential symlink .claude/.cursor.
          cache-dependency-glob: uv.lock

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler_rs -> target
          key: test

      # Creates .venv with the pinned Python (.python-version); the scripts point PYO3_PYTHON at it.
      - name: Create project venv
        run: uv sync

      - name: Rust tests
        run: ./scripts/test.sh rust

  # Release build of the extension, then everything that imports it.
  python:
    name: Python tests, proofs, kernel builds
    runs-on: ubuntu-24.04  # must match the OR-Tools archive (setup-ortools)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # scripts/measure_baseline.py reads the original baseline builder from an old commit
          fetch-depth: 0

      # Prebuilt C++ archive (bundles protobuf and abseil); cached between runs.
      - name: Install OR-Tools
        uses: ./.github/actions/setup-ortools

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Explicit path: the default '**/uv.lock' glob walks the tree and dies with ELOOP on
          # the self-referential symlink .claude/.cursor.
          cache-dependency-glob: uv.lock

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler_rs -> target
          key: release

      - name: Create project venv
        run: uv sync

      - name: Build scheduler_rs (release)
        run: ./scripts/build_scheduler_rs.sh --release

      - name: Python tests
        run: ./scripts/test.sh python

      - name: Z3 proofs
        run: ./scripts/test.sh proofs

      - name: Kernel builds (greedy 2-round and 16-round, replay + validation)
        run: ./scripts/test.sh kernel

      - name: Upstream check (16-round greedy kernel on the unmodified upstream simulator and tests)
        run: ./scripts/test.sh upstream

      - name: CI-only pin tests (16-round greedy builds, pytest -m ci_only)
        run: ./scripts/test.sh ci-only
