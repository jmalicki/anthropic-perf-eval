[project]
name = "anthropic-perf-eval"
version = "0.1.0"
description = "VLIW kernel optimization challenge"
requires-python = ">=3.10"
dependencies = [
    "pulp>=2.7.0",
    "numpy>=1.24.0",
    "ortools>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "wandb>=0.15.0",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
]

[tool.pytest.ini_options]
timeout = 120
testpaths = [".", "solver", "tests"]
# Optional/CI-only tests: mark with @pytest.mark.ci_only. Default run excludes them: pytest -m "not ci_only". CI runs full suite.
markers = [
    "ci_only: marks tests as optional/CI-only (excluded by default; use -m ci_only to run only these, or run without -m filter for full suite)",
]

[tool.hatch.build.targets.wheel]
packages = ["solver", "problem.py", "perf_takehome.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
