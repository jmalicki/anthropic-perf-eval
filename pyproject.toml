[project]
name = "anthropic-perf-eval"
version = "0.1.0"
description = "VLIW kernel optimization challenge"
requires-python = ">=3.10"
dependencies = [
    "pulp>=2.7.0",
    "numpy>=1.24.0",
    "ortools>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "wandb>=0.15.0",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
]
verify = [
    "z3-solver>=4.12.0",
]

# Installed by default with `uv run`, so `uv run pytest` works without extras.
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
    "z3-solver>=4.12.0",
    "maturin>=1.0,<2.0",
]

[tool.pytest.ini_options]
timeout = 120
testpaths = [".", "solver", "tests"]
# Optional/CI-only tests (e.g. 16-round pin builds): mark with @pytest.mark.ci_only. Every
# pytest run deselects them by default (addopts below); a later -m on the command line replaces
# it: `uv run pytest -m ci_only` runs only them, `./scripts/test.sh ci-only` too (CI runs that).
addopts = "-m 'not ci_only'"
markers = [
    "ci_only: optional/CI-only tests (deselected by default via addopts; run them with -m ci_only or ./scripts/test.sh ci-only)",
]

[tool.hatch.build.targets.wheel]
packages = ["solver", "verification", "problem.py", "perf_takehome.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
