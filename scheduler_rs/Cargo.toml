[package]
name = "scheduler_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "scheduler_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrayvec = { version = "0.7", features = ["serde"] }
rayon = "1.11"
rangemap = "1"

# CP-SAT solver bindings (fork with interval/cumulative support)
# Build requires: ORTOOLS_PREFIX=$(brew --prefix or-tools) RUSTFLAGS='-Clink-arg=-lprotobuf'
cp_sat = { git = "https://github.com/jmalicki/cp_sat.git", branch = "main", optional = true }
prost = { version = "0.8", optional = true }

[features]
default = []
cpsat = ["cp_sat", "prost"]
# Optional: slow/optional tests (proptest, minimal failing config, etc.). CI should use --features "cpsat ci-tests".
ci-tests = []

[profile.release]
lto = true
codegen-units = 1
